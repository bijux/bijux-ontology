target-version = "py311"
line-length = 88
respect-gitignore = true
cache-dir = "../artifacts/root/ruff-cache"
src = ["../packages/bijux-ontology/src", "../packages/bijux-ontology-adapters/src", "../packages/bijux-ontology-reasoning/src", "../packages/bijux-ontology-dev/src"]
extend-exclude = ["artifacts", ".bijux"]

[lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PIE", "RET", "ISC"]
# Preserve readable word tables and formatter-wrapped message literals.
ignore = ["SIM905", "ISC004"]

[lint.isort]
known-first-party = ["bijux_ontology", "bijux_ontology_adapters", "bijux_ontology_reasoning", "bijux_ontology_dev"]
