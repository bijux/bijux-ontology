[mypy]
python_version = 3.11
strict = True
pretty = True
show_error_codes = True
warn_unreachable = True
warn_unused_configs = True
warn_unused_ignores = True
namespace_packages = True
explicit_package_bases = True
cache_dir = artifacts/root/mypy-cache
mypy_path = $MYPY_CONFIG_FILE_DIR/../packages/bijux-ontology/src,$MYPY_CONFIG_FILE_DIR/../packages/bijux-ontology,$MYPY_CONFIG_FILE_DIR/../packages/bijux-ontology-dev/src,$MYPY_CONFIG_FILE_DIR/../packages/bijux-ontology-dev
exclude = artifacts|\.bijux
