[run]
branch = True
parallel = False
relative_files = True
source =
    bijux_ontology
    bijux_ontology_dev
data_file = artifacts/root/coverage/.coverage
omit =
    */.tox/*
    */.venv/*
    */site-packages/*
    */tests/*

[report]
show_missing = True
skip_covered = False
precision = 1

[html]
directory = artifacts/root/coverage/htmlcov
