[pytest]
minversion = 8.4
testpaths =
    packages/bijux-ontology/tests
    packages/bijux-ontology-dev/tests
cache_dir = artifacts/root/pytest-cache
xfail_strict = true
timeout = 120
timeout_method = thread
timeout_func_only = false
addopts = -ra --import-mode=importlib --strict-markers --strict-config --tb=short
norecursedirs = .git .bijux .venv .tox artifacts build dist htmlcov node_modules
markers =
    unit: focused unit tests
    functional: component and workflow integration tests
    e2e: installed-package end-to-end tests
    slow: long-running tests
