[project]
name = "bijux-ontology-workspace"
version = "0.0.0"
requires-python = ">=3.11,<4"

[tool.uv]
package = false
constraint-dependencies = [
  "certifi>=2026.10.19",
]
required-version = ">=0.13.1"
conflicts = [
  [
    {package = "bijux-ontology-adapters", extra = "oak"},
    {package = "bijux-ontology-adapters", extra = "frictionless"},
  ],
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
bijux-ontology = { workspace = true }
bijux-ontology-adapters = { workspace = true }
bijux-ontology-dev = { workspace = true }
bijux-ontology-reasoning = { workspace = true }

[dependency-groups]
dev = [
  "bijux-ontology-dev",
  "bijux-ontology-reasoning",
  "bijux-ontology[analysis,shex,quantities,jsonpatch,jsonld,shacl,templates,xsd,patterns,checksums,sssom]",
  "bijux-ontology-adapters[biolink,biosamples,csvw,fhir,linkml,oak,pydantic]",
  "build>=1.2,<2",
  "hatchling>=1.27,<2",
  "twine>=6,<7",
  "pytest-cov>=6,<8",
  "pytest>=8.4,<10",
  "pytest-timeout>=2.3,<3",
  "pytest-xdist>=3.8,<4",
  "ruff>=0.6,<1",
  "mypy>=1.11,<3",
  "deptry>=0.23,<1",
  "interrogate>=1.7,<2",
  "vulture>=2.13,<3",
  "codespell>=2.4,<3",
  "radon>=6,<7",
]
