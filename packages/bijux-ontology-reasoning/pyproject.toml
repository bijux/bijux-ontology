[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "bijux-ontology-reasoning"
version = "0.1.0"
description = "Optional owned OWL profile checks through a pinned maintained backend"
readme = "README.md"
requires-python = ">=3.11,<4"
license = "MIT"
authors = [{name = "Bijan Mousavi", email = "bijan@bijux.io"}]
dependencies = ["bijux-ontology==0.1.0", "rdflib>=7.6,<8"]

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["src/bijux_ontology_reasoning"]

[tool.hatch.build.targets.wheel.force-include]
"java" = "bijux_ontology_reasoning/java"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["src", "java", "tests", "pyproject.toml", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "artifacts/pytest-cache"
addopts = "--import-mode=importlib"
