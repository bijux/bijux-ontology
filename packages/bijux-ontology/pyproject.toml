[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "bijux-ontology"
version = "0.1.0"
description = "Explicit vocabulary, JSON-LD and structural declaration checks"
readme = "README.md"
requires-python = ">=3.11,<4"
license = "MIT"
authors = [{name = "Bijan Mousavi", email = "bijan@bijux.io"}]
dependencies = [
    "rdflib>=7.6,<8",
    "pyoxigraph>=0.5.11,<0.6",
]

[project.scripts]
bijux-ontology = "bijux_ontology.interfaces.cli:main"

[project.optional-dependencies]
fhir = [
    "fhir.resources==8.3.0",
]
shex = [
    "pyrudof==0.3.20",
]
quantities = [
    "pint>=0.25.3,<0.26",
]
csvw = [
    "csvw>=4.1.0,<5",
]
jsonpatch = [
    "jsonpatch>=1.35,<2",
    "jsonpointer>=3,<4",
]
markup = [
    "lxml>=6,<7",
]
jsonschema = [
    "jsonschema>=4.26,<5",
    "referencing>=0.37,<0.38",
]
jsonld = [
    "pyld>=3.3,<4",
    "lxml>=6,<7",
]
shacl = [
    "owlrl>=7.6.2,<8",
    "pyparsing>=3.2,<4",
    "pyshacl>=0.40.1,<0.41",
]
pydantic = [
    "pydantic>=2.11,<3",
]
linkml = [
    "linkml-runtime>=1.12.1,<2",
]
checksums = [
    "python-stdnum>=2.2,<3",
]
templates = [
    "uri-template>=1.3,<2",
]
xsd = [
    "elementpath>=5.1.4,<6",
]
patterns = [
    "google-re2>=1.1.20251105,<2",
]

sssom = [
    "sssom==0.4.21",
    "sssom-schema==1.1.0a5",
    "pandas>=2,<4",
    "pyyaml>=6,<7",
]

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["src/bijux_ontology"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["src", "tests", "pyproject.toml", "README.md", "LICENSE"]

[tool.hatch.build.targets.sdist.force-include]
"../../docs" = "docs"
"../../examples" = "examples"

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "artifacts/pytest-cache"
addopts = "--import-mode=importlib"
